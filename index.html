<body>
  <div class="stage">
    <div class="phone bog-sheet-host" id="phone">
      <div class="screen">
        <header class="bog-navbar">
          <div class="bog-statusbar"></div>
          <div class="bog-navbar__header">
            <button class="bog-icon-btn" data-type="neutral" data-size="small" aria-label="უკან"><span class="bog-icon" data-icon="chevron-left"></span></button>
            <div class="bog-navbar__titles"><h1 class="bog-navbar__title">აქციების დამატება</h1></div>
            <div class="bog-navbar__actions">
              <button class="bog-icon-btn" data-type="neutral" data-size="small" aria-label="ჩატი"><span class="bog-icon" data-icon="chat"></span></button>
            </div>
          </div>
        </header>

        <main class="screen__body" id="body">
          <div class="search-bar" id="search-bar">
            <div class="bog-search" id="search">
              <label class="bog-search__box">
                <span class="bog-search__icon"></span>
                <input class="bog-search__input" type="search" placeholder="ძებნა" aria-label="ძებნა" id="search-input">
                <button type="button" class="bog-search__clear" aria-label="გასუფთავება"></button>
              </label>
              <button type="button" class="bog-search__cancel">გაუქმება</button>
            </div>
            <!-- Filters: sort & filter sheet + one-tap chips -->
            <div class="filters-row" id="filters-row">
              <button type="button" class="bog-chip" data-type="icon" aria-pressed="false" aria-label="დალაგება და ფილტრები" id="filter-btn" data-sheet-open="filter-sheet">
                <span class="bog-icon" style="--icon: url(assets/icons/sliders.svg)"></span><span class="bog-chip__count" id="filter-count" style="display:none">0</span>
              </button>
              <div class="bog-chip-group" id="chips"></div>
            </div>
          </div>

          <!-- შენი აქციები: checkbox = ყველას მონიშვნა, დანარჩენი ხაზი = sheet -->
          <div class="bog-list owned-row-wrap">
            <div class="bog-list-item owned-row" id="owned-row">
              <input type="checkbox" class="bog-checkbox__input" id="owned-all" aria-label="ყველა ჩემი აქციის მონიშვნა">
              <button type="button" class="owned-row__open" data-sheet-open="owned-sheet" aria-label="შენი აქციების ნახვა">
                <span class="bog-list-item__content">
                  <span class="bog-list-item__label">შენი აქციები</span>
                  <span class="bog-list-item__subtitle" id="owned-sub">12 აქცია · 1,164.31 $</span>
                </span>
                <span class="bog-avatar-group" id="owned-avatars"></span>
                <span class="bog-list-item__chevron"></span>
              </button>
            </div>
          </div>

          <section class="bog-section" id="others">
            <header class="bog-section__header">
              <div class="bog-section__heading"><h2 class="bog-section__title" id="list-title">სხვა აქციები</h2></div>
            </header>
            <div class="bog-section__content">
              <div class="list-groups" id="others-list"></div>
              <p class="empty-hint" id="empty-hint" hidden>ვერაფერი მოიძებნა</p>
            </div>
          </section>
        </main>

        <footer class="bog-stickybar" id="sticky">
          <div class="bog-stickybar__slot">
            <div class="bog-selection" data-size="small" data-insert="start" id="tray" aria-label="არჩეული აქციები" hidden></div>
          </div>
          <div class="bog-stickybar__buttons">
            <button class="bog-btn" data-type="primary" data-width="fill" id="cta">პორტფელში დამატება</button>
          </div>
          <span class="bog-stickybar__home"></span>
        </footer>
      </div>

      <!-- Phone keyboard mock (desktop only; on a phone the real keyboard opens) -->
      <div class="kb" id="kb" aria-hidden="true"></div>

      <!-- დალაგება და ფილტრები — Bottom Sheet -->
      <div class="bog-sheet" id="filter-sheet" hidden>
        <div class="bog-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="filter-sheet-title">
          <header class="bog-sheet__nav">
            <div class="bog-sheet__heading"><h2 class="bog-sheet__title" id="filter-sheet-title">დალაგება და ფილტრები</h2></div>
          </header>
          <div class="bog-sheet__content filter-body">
            <fieldset class="bog-radio-group">
              <legend class="bog-radio-group__label">დალაგება</legend>
              <div class="bog-radio-group__options" id="sort-options"></div>
            </fieldset>
            <section class="bog-section" data-size="small">
              <header class="bog-section__header"><div class="bog-section__heading"><h2 class="bog-section__title">კომპანიის ზომა</h2></div></header>
              <div class="bog-section__content"><div class="bog-chip-group" data-wrap id="size-chips"></div></div>
            </section>
            <section class="bog-section" data-size="small">
              <header class="bog-section__header"><div class="bog-section__heading"><h2 class="bog-section__title">ფასის ცვლილება · დღეს</h2></div></header>
              <div class="bog-section__content"><div class="bog-chip-group" data-wrap id="change-chips"></div></div>
            </section>
            <section class="bog-section" data-size="small">
              <header class="bog-section__header"><div class="bog-section__heading"><h2 class="bog-section__title">დივიდენდი</h2></div></header>
              <div class="bog-section__content">
                <label class="bog-checkbox">
                  <input type="checkbox" class="bog-checkbox__input" id="div-only">
                  <span class="bog-checkbox__text"><span class="bog-checkbox__label">მხოლოდ დივიდენდიანი აქციები</span></span>
                </label>
              </div>
            </section>
          </div>
          <div class="bog-sheet__bar">
            <button class="bog-btn" data-type="primary" data-width="fill" id="filter-apply">ჩვენება</button>
            <button class="bog-btn" data-type="ghost" data-width="fill" id="filter-clear">გასუფთავება</button>
          </div>
        </div>
      </div>

      <!-- შენი აქციები — Bottom Sheet -->
      <div class="bog-sheet" id="owned-sheet" hidden>
        <div class="bog-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="owned-sheet-title">
          <header class="bog-sheet__nav">
            <div class="bog-sheet__heading">
              <h2 class="bog-sheet__title" id="owned-sheet-title">შენი აქციები</h2>
            </div>
          </header>
          <div class="bog-sheet__content">
            <div class="search-bar search-bar--sheet" id="sheet-search-bar">
              <div class="bog-search" id="sheet-search">
                <label class="bog-search__box">
                  <span class="bog-search__icon"></span>
                  <input class="bog-search__input" type="search" placeholder="ძებნა" aria-label="ძებნა შენს აქციებში" id="sheet-search-input">
                  <button type="button" class="bog-search__clear" aria-label="გასუფთავება"></button>
                </label>
                <button type="button" class="bog-search__cancel">გაუქმება</button>
              </div>
            </div>
            <section class="bog-section" data-size="small">
              <header class="bog-section__header">
                <div class="bog-section__heading"><h2 class="bog-section__title">12 აქცია · 1,164.31 $</h2></div>
                <button class="bog-btn" data-type="text-primary" id="sheet-all">ყველას მონიშვნა</button>
              </header>
              <div class="bog-section__content"><div class="bog-list" id="sheet-list"></div><p class="empty-hint" id="sheet-empty" hidden>ვერაფერი მოიძებნა</p></div>
            </section>
          </div>
          <div class="bog-sheet__bar">
            <button class="bog-btn" data-type="primary" data-width="fill" id="sheet-apply">არჩევა</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
